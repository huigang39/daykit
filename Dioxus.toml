[application]

# 项目名
name = "daykit"

# 默认平台:我们做网页应用(再"添加到主屏"当 app 用)
default_platform = "web"

# 构建产物目录
out_dir = "dist"

# 静态资源目录(manifest.json / sw.js / 图标 会原样拷到产物根目录)
asset_dir = "public"

[web.app]

# 浏览器标签页标题
title = "DayKit"

[web.watcher]

reload_html = true
watch_path = ["src", "public", "assets"]
